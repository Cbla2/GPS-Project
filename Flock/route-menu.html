

<script>
    async function showRoutes() {
        let routes = [];

        try {
            const response = await fetch("/api/routes");

            if (!response.ok) {
                throw new Error("Server not available");
            }

            routes = await response.json();
        }
        catch (error) {
            routes = [
                {
                    name: "Route 28",
                    road: "Route 28",
                    minutes: 20,
                    cameraCount: 0,
                    recommended: true
                },
                {
                    name: "Route 29",
                    road: "Route 29",
                    minutes: 25,
                    cameraCount: 2,
                    recommended: false
                },
                {
                    name: "Route 66",
                    road: "Route 66",
                    minutes: 30,
                    cameraCount: 4,
                    recommended: false
                }
            ];
        }

        routes.forEach(route => {
            const card = `
                <a href="./navigate.html?route=${encodeURIComponent(route.road)}">
                    <button>
                        <h2>${route.name}</h2>
                        <p>${route.minutes} minutes</p>
                        <p>${route.cameraCount} Flock Cameras</p>
                    </button>
                </a>
            `;

            if (route.recommended) {
                document.getElementById("recommended").innerHTML += card;
            } else {
                document.getElementById("more").innerHTML += card;
            }
        });
    }

    showRoutes();
</script>
