
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Menu</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar">
        <h1>Available Routes</h1>
    </header>

    <h2>Recommended Route</h2>
    <div id="recommended">
        <a href="./navigate.html?route=Route%2028">
            <button>
                <h2>Route 28</h2>
                <p>20 minutes</p>
                <p>0 Flock Cameras</p>
            </button>
        </a>
    </div>

    <h2>More Routes</h2>
    <div id="more">
        <a href="./navigate.html?route=Route%2029">
            <button>
                <h2>Route 29</h2>
                <p>25 minutes</p>
                <p>2 Flock Cameras</p>
            </button>
        </a>

        <a href="./navigate.html?route=Route%2066">
            <button>
                <h2>Route 66</h2>
                <p>30 minutes</p>
                <p>4 Flock Cameras</p>
            </button>
        </a>
    </div>

    <p>
        <a href="./index.html">
            <button>Back</button>
        </a>
        <button type="button">Next</button>
    </p>

    <script>
        async function showRoutes() {
            try {
                const response = await fetch("/api/routes");

                if (!response.ok) {
                    throw new Error("Server not available");
                }

                const routes = await response.json();

                if (!Array.isArray(routes)) {
                    throw new Error("Invalid route data");
                }

                const recommended = document.getElementById("recommended");
                const more = document.getElementById("more");

                recommended.innerHTML = "";
                more.innerHTML = "";

                routes.forEach(route => {
                    const card = `
                        <a href="./navigate.html?route=${encodeURIComponent(route.road)}">
                            <button>
                                <h2>${route.name}</h2>
                                <p>${route.minutes} minutes</p>
                                <p>${route.cameraCount} Flock Cameras</p>
                            </button>
                        </a>
                    `;

                    if (route.recommended) {
                        recommended.innerHTML += card;
                    } else {
                        more.innerHTML += card;
                    }
                });
            }
            catch (error) {
                console.log("Showing example routes");
            }
        }

        showRoutes();
    </script>
</body>
</html>
