
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Menu</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar">
        <h1>Available Routes</h1>
    </header>

    <h2>Recommended Route</h2>
    <div id="recommended"></div>

    <h2>More Routes</h2>
    <div id="more"></div>

    <p>
        <a href="./index.html">
            <button>Back</button>
        </a>
        <button>Next</button>
    </p>

    <script>
        async function showRoutes() {
            const response = await fetch("/api/routes");
            const routes = await response.json();

            routes.forEach(route => {
                const card = `
                    <a href="./navigate.html?route=${encodeURIComponent(route.road)}">
                        <button>
                            <h2>${route.name}</h2>
                            <p>${route.minutes} minutes</p>
                            <p>${route.cameraCount} Flock Cameras</p>
                        </button>
                    </a>
                `;

                if (route.recommended) {
                    document.getElementById("recommended").innerHTML += card;
                } else {
                    document.getElementById("more").innerHTML += card;
                }
            });
        }

        showRoutes();
    </script>
</body>
</html>
