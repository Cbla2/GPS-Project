<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocker - Map</title>
    <link rel = "stylesheet" href="./style.css">
    <link rel="stylesheet" href="./map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header class="topbar">
        <h1>Flocker</h1>
        <a href="./menu.html">
            <button>
                <div></div>
                <div></div>
                <div></div>
            </button>
        </a>
    </header>

    <!--Camera map details-->
    <main class="map-area">
        <div id="map" style="width: 100%; height: 100%"></div>
        <p class="cam-count" id="camera-count" style="top: auto; bottom: 16px; z-index:1000;">Loading...</p>
    </main>

    <script>
        const map = L.map("map").setView([38.95, -77.40], 13);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map)

        const cameraLayer = L.layerGroup().addTo(map);

        function showCameras(data) {
            cameraLayer.clearLayers();
            document.getElementById("camera-count").textContent = data.message;

             data.cameras.forEach(camera => {
                L.circleMarker([camera.latitude, camera.longitude], {
                    radius: 7,
                    color: "#FFFFFF",
                    weight: 2,
                    fillColor: "#D9480F",
                    fillOpacity: 1
                })
                    .on("click", () => {
                        window.location.href = `./camera.html?id=${camera.id}`;
                    })
                    .addTo(cameraLayer);
            });

        }

        function loadCameras() {
            const bounds = map.getBounds();
            const params = new URLSearchParams({
                north: bounds.getNorth(),
                south: bounds.getSouth(),
                east: bounds.getEast(),
                west: bounds.getWest()
            });

            fetch(`/api/cameras?${params}`)
            .then(response => response.json())
                .then(showCameras)
                .catch(() => {
                    document.getElementById("camera-count").textContent = "Couldn't load cameras";
                });
        }

        map.on("moveend", loadCameras);
        loadCameras();

        map.locate({setView: true, maxZoom: 14});

       let userIcon = null;
       let firstFix = true;

       function showUser(position) {
        const latlng = [position.coords.latitude, position.coords.longitude];


        if(!userIcon) {
            userIcon = L.circleMarker(latlng, {
                radius: 8, color: "FFFFFF", weight: 3, fillColor: "#1C64F2", fillOpacity: 1
            }).addTo(map).bindTooltip("You are here");
        } else {
            userIcon.setLatLng(latlng);
        }

        if(firstFix) {
            map.setView(latlng, 14);
            firstFix = false;
        }
       }

       function locationError(err) {
        console.warn("Location unavailable:", err.message);
       }

       if(navigator.geolocation) {
        navigator.geolocation.watchPosition(showUser, locationError);
       }

</script>

</body>
