<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel = "stylesheet" href="./style.css">

<body>
    <header class="topbar">

    /*Camera map details*/
    <main class="map-area">
        <svg class="map-bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            
            <path d="M0 25 H100 M0 65 H100 M20 0 V100 M82 0 V100"
                  stroke="white" stroke-width="10" fill="none" vector-effect="non-scaling-stroke"></path>
            <rect x="60" y="70" width="18" height="14" rx="2" fill="#D3E4CD"></rect>
            <path d="M48 100 C52 75 40 55 46 35 S54 10 52 0"
                  stroke="#D4A72C" stroke-width="22" fill="none" vector-effect="non-scaling-stroke"></path>
            <path d="M48 100 C52 75 40 55 46 35 S54 10 52 0"
                  stroke="#F2C94C" stroke-width="16" fill="none" vector-effect="non-scaling-stroke"></path>
        </svg>

        <span class="map-label" style="left: 64%; top: 4%">Fairfax</span>
        <span class="map-label" style="left: 64%; top: 94%">Sterling</span>
        <span class="shield" style="left: 54%; top: 50%">28</span>

        /*cameras on Route 28*/
        <a class="cam" href="./camera.html?id=1" style="left:49.5%; top: 84%" aria-label="Camera 1 on Route 28"></a>
        <a class="cam" href="./camera.html?id=2" style="left: 46%; top: 60%" aria-label="Camera 2 on Route 28"></a>
        <a class="cam" href="./camera.html?id=3" style="left: 46.5%; top: 36%" aria-label="Camera 3 on Route 28"></a>
        <a class="cam" href="./camera.html?id=4" style="left: 52%; top: 12%" aria-label="Camera 4 on Route 28"></a>

        /*other nearby cameras*/

        <a class="cam off-route" href="./camera.html?id=6" style="left: 82%; top: 25%" aria-label="Camera 6, not on Route 28"></a>
        <a class="cam off-route" href="./camera.html?id=7" style="left: 82%; top: 78%" aria-label="Camera 7, not on Route 28"></a>

        /*user's location*/
        <span class="you" style="left: 48.5%; top: 95%" aria-label="Your location"></span>

        <p class="cam-count">4 cameras on Route 28</p>
    </main>

    <section class="recents">

                <button>

                <button>
