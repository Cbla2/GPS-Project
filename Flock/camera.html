<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocker Camera Details</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./map.css">
</head>
<body>
    <header class="topbar">
        <h1>Camera Details</h1>
    </header>

    <main class="details-page">
        <article class="camera-card">
            <h2><span class="dot" aria-hidden="true"></span><span id="cam-title">Flock ALPR camera</span></h2>
            <dl>
                <dt>Operator</dt>
                <dd id="cam-operator">County police</dd>

                <dt>Location</dt>
                <dd id="cam-location">Route 28, northbound</dd>

                <dt>Facing</dt>
                <dd id="cam-facing">South</dd>

                <dt>Data source</dt>
                <dd id="cam-source">OpenStreetMap</dd>

                <dt>Route</dt>
                <dd id="cam-route">Loading..</dd>
            </dl>
            <a class="close-btn" href="./index.html">Close</a>
        </article>

        <script>
           function showDetails(camera) {
               document.getElementById("cam-title").textContent = camera.title;
               document.getElementById("cam-operator").textContent = camera.operator;
               document.getElementById("cam-location").textContent = camera.location;
               document.getElementById("cam-facing").textContent = camera.facing;
               document.getElementById("cam-source").textContent = camera.source;
               document.getElementById("cam-route").textContent = camera.routeLabel;
           }

            function showError(message) {
                document.getElementById("cam-title").textContent = message;
            }

            function loadCamera(id) {
                fetch(`/api/cameras/${id}`)
                .then(response => response.json())
                .then(data => data.error ? showError(data.error) : showDetails(data))
                .catch(() => showError("Could not load camera details"));
            }

            loadCamera(new URLSearchParams(window.location.search).get("id"));
    </script>
    </main>
</body>
</html>
